<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>訪問地｜削除</title>
<style>
  .custom-alert {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px; /* 幅を追加 */
    max-width: 90%; /* 画面が小さいときの調整 */
    max-height: 80vh;
    background-color: white;
    border: 1px solid black;    
    z-index: 1000;    
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);    
    padding: 30px; /* パディングを拡大 */    
    border-radius: 10px;
    text-align: center;
    padding: 30px;
    }

  .overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 999;
    }

  .custom-alert > div {
    background-color: white;
    color: black; /* テキストカラーを白にする */
    font-size: 20px; /* フォントサイズを大きくする */
    font-weight: bold; /* フォントを太字にする */
    }

  .custom-alert img {
    width: 50%;           
    height: auto;         
    display: block;
    margin: 20px auto;    
    }

  .custom-alert p {
    font-size: 18px;
    margin-bottom: 20px;
    }

  .custom-alert button {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 5px;
    background-color: #8da9e0;
    color: white;
    cursor: pointer;
    }

  .custom-alert button:hover {
    background-color: #5f87d2;
    }

  .custom-alert button:active {
    background-color: #406ac2;
    }    



</style>
</head>
<body>

<button onclick="showAlert()">削除</button>

<div class="overlay"></div>
<div class="custom-alert">
  <div style="background-color: white; margin: 0px; padding: 0px;">訪問地 削除</div>
  <img src="images/logo1.png" alt="削除成功アイコン">
  <p>訪問地の削除完了しました。</p>
  <button onclick="hideAlert()">Close</button>
</div>

<script>
function showAlert() {
  document.querySelector('.custom-alert').style.display = 'block';
  document.querySelector('.overlay').style.display = 'block';
}

function hideAlert() {
  document.querySelector('.custom-alert').style.display = 'none';
  document.querySelector('.overlay').style.display = 'none';
}
</script>

</body>
</html>
