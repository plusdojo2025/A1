<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TABI×TILE｜登録</title>
<style>
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        }

    .custom-dialog {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 300px; /* 幅を追加 */
        max-width: 90%; /* 画面が小さいときの調整 */
        max-height: 80vh;
        background-color: white;
        border: 1px solid black;
        z-index: 1001;
        text-align: center;
        border-radius: 10px;
        padding: 20px;      
    }

    .custom-dialog img {
        width: 50%;           
        height: auto;         
        display: block;
        margin: 20px auto;    
    }

    .custom-dialog p {
        font-size: 18px;
        margin-bottom: 20px;
        font-size: 16px; /* フォントサイズを大きくする */
        font-weight: bold; /* フォントを太字にする */  
        white-space: nowrap;  /* ← 改行防止 */
    }

    .dialog-buttons {
        display: flex;
        justify-content: center;
        gap: 100px; /* ボタンの間隔 */
        margin-top: 20px;
    }
    .btn-no, .btn-yes {
    width: 120px;            /* 固定幅 */
    height: 50px;            /* 高さも必要なら指定 */
    display: flex;           /* 中央揃えのためflex使用 */
    align-items: center;     /* 上下中央 */
    justify-content: center; /* 左右中央 */
    font-size: 16px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
    }

  .btn-no {
      background-color: #e79bb7; /* ピンク */
      color: white;

    }

  .btn-no:hover {
      background-color: #d9769b;
    }

  .btn-no:active {
      background-color: #cc4f7f;
    }

    .btn-yes {
        background-color: #8da9e0; /* ブルー */
        color: white;
  }

  .btn-yes:hover {
      background-color: #5f87d2;
    }

  .btn-yes:active {
      background-color: #406ac2;
    }

</style>
</head>
<body>

<button onclick="showConfirmDialog()">登録</button>

<div id="overlay" class="overlay" style="display:none;"></div>
<div id="confirmDialog" class="custom-dialog" style="display:none;">
  <p>この内容を<br>登録してもよろしいですか？</p>
  <img src="images/logo2.png" alt="登録確認アイコン">
  <div class="dialog-buttons">
    <button class="btn-no" onclick="handleConfirm(false)">キャンセル</button> <!--画面に戻る-->
    <button class="btn-yes" onclick="handleConfirm(true)">登録する</button> <!--登録し、登録フォームに戻る--><!--登録完了アラートを提示-->
  </div>
</div>

<script>
    function showConfirmDialog() {
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('confirmDialog').style.display = 'block';
    }

    function handleConfirm(isConfirmed) {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('confirmDialog').style.display = 'none';
        if (isConfirmed) {
            console.log('User confirmed the action.');
            // ここに「Yes」を選択したときの処理を記述
        } else {
            console.log('User canceled the action.');
            // ここに「No」を選択したときの処理を記述
        }
    }

</script>
</body>
</html>
